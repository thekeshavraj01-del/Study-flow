<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎯 JEE & NEET Study Tracker</h1>
<p>Track your preparation, stay consistent, and achieve your dream rank.</p>
</header>
    
<section class="dashboard">

    <div class="stat-card">
        <h3>🔥 Streak</h3>
        <p id="streak">0 Days</p>
    </div>

    <div class="stat-card">
        <h3>⏱ Study Today</h3>
        <p id="todayTime">00:00</p>
    </div>

    <div class="stat-card">
        <h3>🎯 Daily Goal</h3>
        <p>8 Hours</p>
    </div>

    <div class="stat-card">
        <h3>🏆 Target</h3>
        <p>JEE / NEET 2027</p>
    </div>

</section>
    
<main>

    <div class="card">
        <h2>Study Timer</h2>
        <h1 id="timer">00:00:00</h1>

        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div class="card">
        <h2>Today's Goal</h2>

        <progress id="progress" value="0" max="8"></progress>

        <p><span id="hours">0</span> / 8 Hours</p>
    </div>
<div class="card">
    <h2>📚 Subjects</h2>

    <div class="subjects">

        <button class="subject">⚛️ Physics</button>

        <button class="subject">🧪 Chemistry</button>

        <button class="subject">📐 Mathematics</button>

        <button class="subject">🧬 Biology</button>

    </div>
</div>
    <div class="card">
    <h2>Today's Study Plan</h2> 

        <input
            type="text"
            id="taskInput"
           placeholder="Example: Complete Physics - Rotational Motion" 

        <button id="addTask">Add Task</button>

        <ul id="taskList"></ul>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
